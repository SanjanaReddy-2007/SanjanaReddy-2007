name: Test Snake GIF 🐍

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake GIF
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: SanjanaReddy-2007
          outputs: |
            dist/github-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check GIF animation
        run: |
          sudo apt-get update
          sudo apt-get install -y gifsicle

          echo "=== GIF FILE ==="
          ls -lh dist/github-snake.gif

          echo "=== GIF INFORMATION ==="
          gifsicle --info dist/github-snake.gif

          echo "=== EXTRACTING FRAMES ==="
          mkdir -p frames
          gifsicle --explode dist/github-snake.gif --output "frames/frame.gif"

          echo "=== FRAME FILES ==="
          ls -lh frames/

      - name: Push GIF
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
