name: Generate contribution snake 🐍

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Generate snake SVG + GIF
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: SanjanaReddy-2007
          outputs: |
            dist/github-snake.svg?palette=github-dark
            dist/github-snake-pink.svg?color_snake=#ff7eb6&color_dots=#2d1b4e,#5b2a86,#8b5cf6,#c084fc,#ff7eb6
            dist/github-snake.gif

      # 3. Check that all files were generated
      - name: Check generated files
        run: |
          echo "Generated files:"
          find dist -type f -print

      # 4. Check whether GIF contains multiple frames
      - name: Check GIF animation
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

          echo "GIF information:"
          identify dist/github-snake.gif | head -20

          echo "Frame count:"
          identify dist/github-snake.gif | wc -l

      # 5. Push generated files to output branch
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
