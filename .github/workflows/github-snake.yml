name: Generate contribution snake 🐍

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: SanjanaReddy-2007
          outputs: |
            dist/github-snake.gif
            dist/github-snake.svg
            dist/github-snake-pink.svg?color_snake=#ff7eb6&color_dots=#2d1b4e,#5b2a86,#8b5cf6,#c084fc,#ff7eb6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check generated files
        run: |
          echo "Generated files:"
          ls -lh dist/

      - name: Check GIF
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

          echo "GIF:"
          identify dist/github-snake.gif | head -10

          echo "Frame count:"
          identify dist/github-snake.gif | wc -l

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
