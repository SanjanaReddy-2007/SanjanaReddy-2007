name: Generate Snake Animation

on:
  schedule:
    # Runs every day at 00:00 UTC — GitHub's contribution graph updates roughly daily,
    # so once a day is enough to keep the snake in sync.
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main              # regenerate whenever you push to main (optional, remove if noisy)

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate a pink/purple themed snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: SanjanaReddy-2007
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.gif?color_snake=%23ff6ec7&color_dots=%232a0e3d,%23c86bff,%23ff8fd6,%23ff6ec7,%23ffffff

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
