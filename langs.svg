<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 260" width="470" height="260" font-family="Segoe UI,Verdana,sans-serif">

<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a0b2e"/>
    <stop offset="100%" stop-color="#2a0e3d"/>
  </linearGradient>
  <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff8fd6"/>
    <stop offset="100%" stop-color="#c86bff"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="round"><rect x="0" y="0" width="470" height="260" rx="18"/></clipPath>
</defs>


    <style>
      .card { opacity:0; animation: cardIn 0.6s ease-out forwards; }
      @keyframes cardIn { from{opacity:0;} to{opacity:1;} }
      .seg { transform: scaleX(0); transform-box: fill-box; transform-origin: left; animation: growSeg 1.1s cubic-bezier(.3,.8,.3,1) forwards; }
      @keyframes growSeg { to { transform: scaleX(1); } }
      .lbl { opacity:0; animation: lblIn 0.5s ease-out forwards; }
      @keyframes lblIn { to { opacity:1; } }
    </style>
    
<g class="card" clip-path="url(#round)">
<rect width="470" height="260" fill="url(#bgGrad)"/>
<rect x="1" y="1" width="468" height="258" rx="17" fill="none" stroke="rgba(255,182,230,0.3)" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" font-weight="700" fill="#f3e8ff">Most Used Languages</text>
<rect x="24" y="56" width="422" height="22" rx="11" fill="rgba(255,255,255,0.08)"/>
<g class="seg" style="animation-delay:0.00s">
