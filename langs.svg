</g>
<rect x="24" y="56" width="422" height="22" rx="11" fill="none" stroke="rgba(255,182,230,0.3)" stroke-width="1"/>
<g class="lbl" style="animation-delay:0.70s" transform="translate(24,108)">
<circle cx="5" cy="-5" r="5" fill="#3572A5"/>
<text x="18" y="0" font-size="13.5" fill="#f3e8ff">Python</text>
<text x="422" y="0" font-size="13" fill="#c9a8e0" text-anchor="end">38%</text>
</g>
